name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm lint
      - run: node node_modules/typescript/bin/tsc --noEmit
      - run: corepack pnpm test:supabase
      - run: corepack pnpm build
      - run: corepack pnpm test:production

  vercel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm build:vercel
      - name: Audit Next.js production server
        run: |
          corepack pnpm start:vercel --hostname 127.0.0.1 --port 4317 > /tmp/astersync-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"; cat /tmp/astersync-next.log' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4317/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/audit-next.mjs http://127.0.0.1:4317
